<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korean Homework</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="speech-result.css">
  <link rel="stylesheet" href="study-position.css">
</head>
<body>

  <header class="site-header">
    <button id="site-home-button" class="site-home-button" type="button">
      꾀꼬리반 숙제
    </button>
  </header>

  <main class="page">

    <!-- First visit: enter a name stored only on this device -->
    <section id="selection-view" class="view" hidden>
      <h1 class="view-title">What is your name?</h1>
      <form id="name-form" style="width:100%; max-width:360px; display:flex; flex-direction:column; gap:1rem;">
        <input
          id="student-name-input"
          type="text"
          autocomplete="name"
          maxlength="40"
          placeholder="Your name"
          aria-label="Your name"
          style="width:100%; box-sizing:border-box; font:inherit; font-size:1.15rem; padding:0.9rem 1rem; border:2px solid var(--color-border); border-radius:16px;"
        >
        <button class="btn btn--primary" type="submit">Start Homework</button>
      </form>
    </section>

    <!-- Return visit: welcome back the locally saved name -->
    <section id="welcome-view" class="view" hidden>
      <h1 class="view-title">Welcome back!</h1>
      <div id="welcome-student" class="welcome-student"></div>
      <button id="welcome-start-button" class="btn btn--primary" type="button">
        Start Homework
      </button>
      <button id="change-student-button" class="btn btn--secondary" type="button">
        Change Name
      </button>
    </section>

    <!-- Home screen: homework list only -->
    <section id="home-view" class="view" hidden>
      <div id="home-student" class="home-student"></div>
      <ul id="homework-list" class="homework-list"></ul>
      <button id="home-change-student-button" class="btn btn--secondary" type="button">
        Change Name
      </button>
    </section>

    <!-- Homework study screen -->
    <section id="placeholder-view" class="view" hidden>
      <h1 class="view-title">This Week's Homework</h1>
      <p class="placeholder-message">Homework coming soon!</p>
      <button id="placeholder-back-button" class="btn btn--secondary" type="button">
        Back
      </button>
    </section>

  </main>

  <!-- Data sources -->
  <script src="homework.js"></script>
  <script src="words.js"></script>
  <script src="storage.js"></script>

  <!-- Shared UI helpers and views -->
  <script src="selection-view.js"></script>
  <script src="welcome-view.js"></script>
  <script src="home-view.js"></script>
  <script src="week-section-view.js"></script>
  <script src="story-view.js"></script>
  <script src="quiz-placeholder-view.js"></script>
  <script src="placeholder-view.js"></script>
  <script src="study-position.js"></script>
  <script src="data/api.js"></script>
  <script src="data/homework-service.js"></script>
  <script src="app.js"></script>
</body>
</html>
